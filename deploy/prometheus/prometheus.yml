global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # DNS service discovery: every replica behind the `api` name is scraped individually.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        refresh_interval: 10s
        port: 9100

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        refresh_interval: 10s
        port: 9100

  - job_name: scheduler
    dns_sd_configs:
      - names: [scheduler]
        type: A
        refresh_interval: 10s
        port: 9100

  - job_name: payment-gateway
    static_configs:
      - targets: ["payment-gateway:8090"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
