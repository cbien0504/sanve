worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # Keep a client-supplied request id (the API validates it), otherwise generate one.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json escape=json '{"time":"$time_iso8601","request_id":"$req_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_duration":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Coarse per-IP flood protection at the edge. Fair per-user limits live in the API (Redis).
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=500r/s;
    limit_req_status 429;

    # Re-resolve the service name so API replicas added or restarted later receive traffic.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            limit_req zone=per_ip burst=1000 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            # Try another replica on connection errors. nginx never retries POST/PATCH here
            # (non-idempotent) unless told to, which is exactly what we want.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
    }
}
