apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanve-scheduler
  labels:
    app.kubernetes.io/name: sanve-scheduler
    app.kubernetes.io/component: scheduler
spec:
  # Two replicas for availability: the relay splits rows with SKIP LOCKED and clean-up jobs take
  # a Redis lock, so running more than one is safe.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sanve-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanve-scheduler
        app.kubernetes.io/component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: sanve-api
          command: ["python", "-m", "app.workers.scheduler"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: sanve-config
            - secretRef:
                name: sanve-secrets
          env:
            - name: SERVICE_NAME
              value: sanve-scheduler
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
