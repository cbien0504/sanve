apiVersion: v1
kind: ConfigMap
metadata:
  name: sanve-config
data:
  ENV: production
  LOG_LEVEL: INFO
  HOLD_TTL_SECONDS: "600"
  ORDER_TTL_SECONDS: "900"
  PAYMENT_BASE_URL: https://api.payment-provider.example
  SMTP_HOST: smtp.mail-provider.example
  SMTP_PORT: "587"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  # Connection budget: max replicas x (pool + overflow) must stay below PostgreSQL's
  # max_connections. With the HPA at 20 API pods that is 20 x 15 = 300: put PgBouncer in front.
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "5"
