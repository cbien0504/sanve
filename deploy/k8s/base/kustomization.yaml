apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production-shaped base. PostgreSQL, Redis and RabbitMQ are expected to be managed services
# (RDS, ElastiCache, Amazon MQ...). Their URLs and every secret come from the `sanve-secrets`
# Secret, created outside Git (External Secrets / Sealed Secrets / `kubectl create secret`).
namespace: sanve

labels:
  - pairs:
      app.kubernetes.io/part-of: sanve
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - scheduler.yaml
  - ingress.yaml

images:
  - name: sanve-api
    newName: ghcr.io/example/sanve-api
    newTag: "1.0.0"
