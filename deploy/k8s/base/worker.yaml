apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanve-worker
  labels:
    app.kubernetes.io/name: sanve-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2 # competing consumers: add replicas when queue depth grows
  selector:
    matchLabels:
      app.kubernetes.io/name: sanve-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanve-worker
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      terminationGracePeriodSeconds: 40 # in-flight messages get 25 s to finish after SIGTERM
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: sanve-api
          command: ["python", "-m", "app.workers.consumer"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: sanve-config
            - secretRef:
                name: sanve-secrets
          env:
            - name: SERVICE_NAME
              value: sanve-worker
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp # the QR-code process pool needs a writable /tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
