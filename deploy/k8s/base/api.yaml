apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanve-api
  labels:
    app.kubernetes.io/name: sanve-api
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below the current capacity during a deploy
  selector:
    matchLabels:
      app.kubernetes.io/name: sanve-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanve-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sanve-api
      containers:
        - name: api
          image: sanve-api
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: sanve-config
            - secretRef:
                name: sanve-secrets
          env:
            - name: SERVICE_NAME
              value: sanve-api
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi # no CPU limit: throttling hurts latency more than it protects
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe: # leaves the Service endpoints while the DB or Redis is unreachable
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe: # process only: a DB outage must not restart every pod
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal propagates, then uvicorn drains on SIGTERM.
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sanve-api
spec:
  selector:
    app.kubernetes.io/name: sanve-api
  ports:
    - name: http # metrics (9100) are deliberately not part of the Service
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sanve-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sanve-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # flash sales ramp up in seconds
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sanve-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sanve-api
