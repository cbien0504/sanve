# Run before rolling out a new version (CD pipeline step, Argo CD PreSync hook or Helm pre-upgrade
# hook). Job specs are immutable, so a pipeline gives each release its own name (e.g. a suffix).
# Migrations must stay backward compatible with the version still running (expand -> contract).
apiVersion: batch/v1
kind: Job
metadata:
  name: sanve-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sanve-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: sanve-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: sanve-config
            - secretRef:
                name: sanve-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
