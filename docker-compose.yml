name: sanve

x-app-environment: &app-environment
  ENV: local
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  PAYMENT_BASE_URL: http://payment-gateway:8090
  PAYMENT_API_KEY: ${PAYMENT_API_KEY:?set PAYMENT_API_KEY in .env}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
  HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
  ORDER_TTL_SECONDS: ${ORDER_TTL_SECONDS:-900}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  SENTRY_DSN: ${SENTRY_DSN:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

x-app: &app
  image: sanve-api:local
  build:
    context: ./services/api
    target: runtime
  restart: unless-stopped
  environment: *app-environment

services:
  # --- data stores -----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=250
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- application -----------------------------------------------------------------------------
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli bootstrap-admin"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["python", "-m", "app.workers.consumer"]
    environment:
      <<: *app-environment
      SERVICE_NAME: sanve-worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["python", "-m", "app.workers.scheduler"]
    environment:
      <<: *app-environment
      SERVICE_NAME: sanve-scheduler
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  payment-gateway:
    image: sanve-payment-gateway:local
    build: ./services/payment-gateway
    restart: unless-stopped
    environment:
      API_KEY: ${PAYMENT_API_KEY}
      WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      WEBHOOK_URL: http://nginx/api/v1/webhooks/payments
      PUBLIC_URL: http://localhost:8090
      FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.1}
      MAX_LATENCY_MS: ${PAYMENT_MAX_LATENCY_MS:-300}
      DUPLICATE_WEBHOOKS: ${PAYMENT_DUPLICATE_WEBHOOKS:-true}
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "/payment-gateway", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

  # --- developer tools & observability ---------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sanve-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports: ["16686:16686"]

  # --- tests (docker compose --profile test run --rm tests) ------------------------------------
  tests:
    profiles: ["test"]
    image: sanve-api:test
    build:
      context: ./services/api
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/sanve_test
      TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
