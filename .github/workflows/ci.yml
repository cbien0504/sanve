name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · lint, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sanve
          POSTGRES_PASSWORD: sanve-ci
          POSTGRES_DB: sanve_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sanve -d sanve_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sanve:sanve-ci@localhost:5432/sanve_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (unit + integration on real PostgreSQL/Redis, migrations up → down → up)
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Models and migrations are in sync
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: services/api/coverage.xml

  payment-gateway:
    name: Payment gateway · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/payment-gateway/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render with kustomize and validate against the Kubernetes schemas
        run: |
          for dir in deploy/k8s/base deploy/k8s/overlays/local; do
            kubectl kustomize "$dir" | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -
          done

  images:
    name: Image · ${{ matrix.name }}
    needs: [api, payment-gateway, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: sanve-api
            context: services/api
          - name: sanve-payment-gateway
            context: services/payment-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests only build; main also pushes an image tagged with the commit SHA.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
